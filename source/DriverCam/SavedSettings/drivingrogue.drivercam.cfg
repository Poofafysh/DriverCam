## Settings file was created by plugin DriverCam v0.5.0
## Plugin GUID: drivingrogue.drivercam

[Controls]

## How far one press moves the seat, in meters.
# Setting type: Single
# Default value: 0.05
TuneStep = 0.05

[Driver]

## Eye height as a fraction of the car body's height (0 = ground, 1 = roof).
# Setting type: Single
# Default value: 0.8
HeadHeight = 0.8

## Eye position along the car as a fraction of its length from the center (negative = towards the back).
# Setting type: Single
# Default value: -0.05
HeadForward = -0.05

## Extra left/right shift in meters.
# Setting type: Single
# Default value: 0
OffsetX = 0.05

## Extra up/down shift in meters.
# Setting type: Single
# Default value: 0
OffsetY = 0.05

## Extra forward/back shift in meters.
# Setting type: Single
# Default value: 0
OffsetZ = -0.35

## Look-down angle in degrees.
# Setting type: Single
# Default value: 3
Pitch = 1

## How many degrees the driver looks into a turn at full steering.
# Setting type: Single
# Default value: 6
LookIntoTurn = 0

[General]

## Add the Driver view to the game's own camera-switch list. F6 toggles it either way.
# Setting type: Boolean
# Default value: true
AddToCameraCycle = true

## Write the game's built-in camera mode values to the BepInEx log.
# Setting type: Boolean
# Default value: true
LogCameraModes = true

## Internal: used to reset seat offsets when the placement logic changes.
# Setting type: Int32
# Default value: 0
LayoutVersion = 3

[Seat]

OffsetX = 0

OffsetY = 0.2

OffsetZ = -0.8

Pitch = 0

[UI]

## Show the on-screen DriverCam button.
# Setting type: Boolean
# Default value: true
ShowButton = true

## Button position from the left edge, in pixels.
# Setting type: Single
# Default value: 20
ButtonX = 20

## Button position from the top edge, in pixels.
# Setting type: Single
# Default value: 420
ButtonY = 420

## Size of the DriverCam button and panel.
# Setting type: Single
# Default value: 1.5
UiScale = 1.5

[View]

## Field of view at low speed.
# Setting type: Single
# Default value: 60
Fov = 60

## Extra field of view at top speed.
# Setting type: Single
# Default value: 8
FovSpeedBoost = 8

## Camera near clip plane in driver view, so the cockpit isn't cut off.
# Setting type: Single
# Default value: 0.03
NearClip = 0.05

## Show the dashboard, steering wheel, pillars and mirror in driver view.
# Setting type: Boolean
# Default value: true
ShowCockpit = true

## Hide the player's car body in driver view.
# Setting type: Boolean
# Default value: false
HideCarBody = false

## Steering wheel rotation in degrees at full lock.
# Setting type: Single
# Default value: 120
SteerAngle = 180

## Size multiplier for the cockpit model (1 = fitted to the car's width).
# Setting type: Single
# Default value: 1
CockpitScale = 1

## How much the cockpit lights itself up, so it stays visible on dark tracks (0 = only scene lighting).
# Setting type: Single
# Default value: 0.35
InteriorBrightness = 0.35

## Draw the game's black cartoon outline around cockpit parts.
# Setting type: Boolean
# Default value: true
CockpitOutline = true

## Cockpit outline thickness relative to the car's own outline.
# Setting type: Single
# Default value: 1
OutlineThickness = 1

